<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mudou de endereço</title>
<meta http-equiv="refresh" content="0; url=https://ismael9zxx-maker.github.io/ar-condicionado/">
<script>
  if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(function (r) { r.forEach(function (x) { x.unregister(); }); });
  if (window.caches) caches.keys().then(function (k) { k.forEach(function (n) { caches.delete(n); }); });
  location.replace('https://ismael9zxx-maker.github.io/ar-condicionado/');
</script>
</head>
<body style="font-family:system-ui,sans-serif;padding:24px">

  <a href="https://ismael9zxx-maker.github.io/ar-condicionado/">ismael9zxx-maker.github.io/ar-condicionado</a></p>
</body>
</html>
